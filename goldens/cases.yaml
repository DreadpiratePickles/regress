# Golden cases for the support-ticket summarizer.
# See README.md in this directory for the rules and format.
#
# The first two cases were the worked examples. The rest were drafted from a
# category brief and then independently reviewed; every case names, in `notes`,
# the regression it exists to catch.

- id: double_charge_refund
  tags: [happy_path, billing]
  input: |
    Hi, I ordered the blue running shoes last Tuesday and I see two charges of
    $89.99 on my card statement. I only placed one order. Please refund the
    duplicate charge. Thanks, Maria
  criteria:
    - States that the customer was charged twice for one order.
    - States that the customer wants a refund of the duplicate charge.
    - Does not invent an order number (the ticket contains none).
    - Is at most 3 sentences.
  notes: Baseline billing case. Catches hallucinated identifiers.

- id: angry_two_issues
  tags: [tone, multi_issue]
  input: |
    This is the THIRD time I'm writing. Your app crashes every time I open the
    orders tab and NOBODY has replied to my last two emails. I'm done. Fix the
    crash and tell me why I'm being ignored. Absolutely ridiculous.
  criteria:
    - "Mentions both issues: the app crash on the orders tab, and the lack of
      response to previous emails."
    - Conveys that the customer is frustrated, without using insults or
      shouting (no all-caps words).
    - Does not promise or describe any fix (the summary is not a reply).
  notes: Two issues in one ticket; a regressed prompt often drops the second.

# ---------------------------------------------------------------------------
# Category checklist — every category has at least one case below:
#   happy_path      a plain, ordinary ticket
#   multi_issue     more than one problem in one ticket
#   tone            angry / sarcastic / overly polite
#   noise           rambling, irrelevant detail the summary must skip
#   ambiguous       unclear what the customer actually wants
#   empty_or_tiny   "" or "help" — what should the summary do?
#   oversized       a very long ticket (paste a wall of text)
#   injection       ticket text that tries to give the model instructions
#   non_english     a ticket in another language
#   hallucination   a ticket missing a detail the model is tempted to invent
# ---------------------------------------------------------------------------

- id: package_stuck_in_transit
  tags: [happy_path, shipping]
  input: |
    Hi there, my package was supposed to arrive last Thursday and the tracking
    page still says "in transit" four days later. It hasn't scanned anywhere
    since Wilmot Junction. Can you tell me where it actually is and when I can
    expect it? Thanks — Devon
  criteria:
    - States that the customer's package is late and that tracking still shows
      it as in transit.
    - States that the customer is asking where the package is and when it will
      arrive.
    - Does not give a delivery date or say the package will arrive (the summary
      is not a reply).
    - Is at most 3 sentences.
  notes: Plain non-billing delivery case; catches prompts that start answering
    the customer instead of summarizing.

- id: csv_export_how_to
  tags: [happy_path, feature_question]
  input: |
    quick question - is there a way to export my saved playlists out of
    Tempolark as a csv? i poked around in settings and the only thing i found
    was "download data" which gave me a zip full of json files. not a
    complaint, i just want to know if csv is possible or if i should go write a
    script instead. thanks
  criteria:
    - States that the customer is asking whether playlists can be exported as a
      CSV file.
    - Mentions that the customer already tried the "download data" option and
      received JSON.
    - Does not describe the ticket as a complaint, bug report, or problem.
    - Is at most 3 sentences.
  notes: Catches prompts that frame every ticket as a complaint even when the
    customer is only asking how to do something.

- id: three_issues_one_minor
  tags: [multi_issue, billing]
  input: |
    Three things and then I'll leave you alone.

    1) I was billed the Pro rate of $42 this month, but I downgraded to Basic
    back in January and I still have the confirmation email.
    2) The scheduling screen shows every appointment in UTC instead of my local
    time, so I nearly missed a job on Monday morning.
    3) Minor one, but the "Help" link in the footer goes to a 404 page.

    Please sort the billing one out first. — Rowan
  criteria:
    - "Mentions all three issues: the Pro-rate charge after a downgrade,
      appointment times shown in UTC instead of local time, and the broken Help
      link in the footer."
    - States that the customer wants the billing issue handled first.
    - Does not state or imply that any of the three issues has been fixed or
      will be fixed.
    - Is at most 3 sentences.
  notes: Three issues where the third is self-labelled minor; regressed prompts
    drop the item the customer downplays.

- id: sarcastic_slow_response
  tags: [tone, sarcasm]
  input: |
    Wow, day nine of waiting for a "24 hour" response. Truly world class. I'm
    sure the ticket I opened about my Brightloom thermostat refusing to connect
    to wifi is being handled by someone very important and very busy. No rush
    at all, it's only the middle of winter. Just let me know at some point
    whether the thermostat is ever going to pair, or whether I should carry on
    with the blanket.
  criteria:
    - States that the customer's Brightloom thermostat will not connect to
      wifi.
    - States that the customer has been waiting around nine days for a reply
      after being told to expect one within 24 hours.
    - Does not state that the customer is satisfied with, or complimentary
      about, the support they have received.
    - Does not state that the customer said there is no rush or no urgency
      (the "no rush" in the ticket is sarcastic).
    - Is at most 3 sentences.
  notes: Sarcasm read literally turns a complaint into praise; this catches a
    prompt that loses figurative language.

- id: polite_data_loss
  tags: [tone, data_loss]
  input: |
    Hello, I do hope this isn't a bother, and I'm so sorry to trouble you on a
    Friday of all days. Everyone I've spoken to has been lovely. I just wanted
    to gently mention that since the update on Wednesday, my client folder in
    Quillhaven Notes appears to be empty — about two years of case notes are no
    longer showing up anywhere. It's very probably something silly I've done!
    Anyway, no rush whatsoever, whenever you have a spare moment. Thank you so
    much for everything you do. Warmly, Priya
  criteria:
    - States that roughly two years of the customer's case notes are missing
      from their Quillhaven Notes client folder.
    - States that the notes disappeared after an update on Wednesday.
    - Does not characterize the issue as minor or cosmetic.
    - Does not assert that the customer caused the loss (the customer only
      speculates that she might have; reporting that speculation is acceptable).
    - Is at most 3 sentences.
  notes: Politeness masking severity; catches prompts that infer urgency from
    tone rather than from the reported problem.

- id: rambling_delivery_day_change
  tags: [noise, subscription]
  input: |
    So I don't normally write in to companies but my sister-in-law said I
    should. Anyway. We moved out to the coast back in March, which was a whole
    saga — the movers lost a box of my mother's china, and then the new place
    turned out to have a possum living in the crawlspace, which took three
    separate visits to sort out, and honestly I'm still not convinced it's gone
    because I hear scratching around four in the morning. Our dog Bramble has
    adjusted well though, he absolutely loves the beach, although he did eat a
    crab last month and we had a vet trip out of it. The vet was very nice
    about it. The point is that during all of this I signed up for your
    Harrowfield Meal Box because I genuinely could not face cooking, and it's
    been fine, the recipes are good, my husband liked the harissa thing
    especially. I did have to skip two weeks in April because we were down at
    my aunt's — she's 91 and doesn't like a fuss. Anyway, what I actually need
    is for you to change the delivery day on my subscription from Tuesday to
    Friday. Tuesdays don't work anymore because of the pottery class I started,
    which I am terrible at, but that's not your problem.
  criteria:
    - States that the customer wants the delivery day on their Harrowfield Meal
      Box subscription changed from Tuesday to Friday.
    - Does not mention the customer's move, dog, vet visit, aunt, or pottery
      class.
    - Does not describe the ticket as a complaint about the meal box service.
    - Is at most 3 sentences.
  notes: Signal-to-noise case; catches prompts that summarize the story instead
    of the request.

- id: ambiguous_no_request
  tags: [ambiguous, account]
  input: |
    I've had the Vellaport account since 2019. Last month my colleague was
    added as a second user, and now the dashboard shows both of our activity
    mixed together in one feed. The invoice went from $30 to $55. I also
    noticed the export button has moved somewhere else. That's the situation.
  criteria:
    - States that it is unclear what the customer is asking for, or that the
      customer makes no explicit request.
    - "Mentions at least one of the situations described: the combined activity
      feed, the invoice increase, or the moved export button."
    - Does not state that the customer is asking for a refund, a cancellation,
      or the removal of the second user.
    - Is at most 3 sentences.
  notes: Catches prompts that manufacture a request when the ticket contains
    none.

- id: single_word_help
  tags: [empty_or_tiny, no_request]
  input: |
    help
  criteria:
    - States that the ticket contains no actionable request or not enough
      information to identify an issue.
    - Does not describe any specific problem, product, order, or account (the
      ticket names none).
    - Does not tell the customer what to do next (the summary is not a reply).
    - Is at most 3 sentences.
  notes: Degenerate input; catches prompts that hallucinate a plausible-sounding
    issue out of a single word.

- id: forwarded_thread_import_failure
  tags: [oversized, integration]
  input: |
    Forwarding the whole chain below since it seems nobody on your side has it.
    Short version is at the bottom of this email but here is everything.

    ---------- Forwarded message ----------
    From: Dana Okonkwo
    To: support
    Subject: Re: Re: FW: Bulk import failing — Nordvale Logistics (acct 8842-KL)

    Hi again,

    Following up on the below. We are still unable to complete the weekly bulk
    import into Kettlebridge Inventory. Same behaviour as previously described.
    Please advise.

    Dana Okonkwo
    Operations Lead, Nordvale Logistics
    Sent from my iPhone

    > On Tue at 4:11 PM, Marcus Feld wrote:
    >
    > Dana,
    >
    > I tried again this morning with the file Priya sent over and it failed at
    > the same place. The progress bar gets to roughly 60 percent and then the
    > page returns "Import could not be completed. Please check your file and
    > try again." No row number, no field name, no detail of any kind. I pulled
    > the log out of the Activity tab and it just repeats that same line four
    > times.
    >
    > I did try to narrow it down. I cut the file in half and imported the
    > first half on its own — that went through fine, 1,140 rows. The second
    > half failed. I cut that half in half again and the failure followed the
