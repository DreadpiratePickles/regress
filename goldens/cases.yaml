    > the Description field has commas inside it, for example "pallet, shrink
    > wrapped, damaged corner". I am fairly confident that is the trigger but I
    > can't prove it from our side without a real error message.
    >
    > For completeness: I tried this on Chrome and on Edge, on two different
    > machines, once on the office wifi and once tethered to my phone in case
    > it was a network timeout. Same failure every time, same 60 percent, same
    > message. I also tried it at 6am when nobody else was in the system.
    >
    > Marcus Feld
    > Warehouse Systems
    >
    >> On Mon, Priya Raghunathan wrote:
    >>
    >> Hi both — attaching this week's file. Note that I did not change the
    >> template at all, it is the exact same one we have been using since we
    >> onboarded in 2023, same column order, same headers. Nothing has changed
